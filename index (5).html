<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Duckly</title>
  <style>
* {
  box-sizing: border-box
}

html,
body {
  height: 100%
}

body {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: #fff;
  color: #202124;
  font-family: "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif
}

/* ---------- Toolbar ---------- */
.toolbar {
  flex: none;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 10px;
  background: #fff;
  border-bottom: 1px solid #e8eaed
}

.tool {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #5f6368;
  font-size: 18px;
  cursor: pointer
}

.tool:hover {
  background: #f1f3f4
}

.address {
  flex: 1;
  height: 38px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  margin: 0 6px;
  background: #f1f3f4;
  border: 1px solid transparent;
  border-radius: 19px
}

.address:focus-within {
  background: #fff;
  border-color: #dadce0;
  box-shadow: 0 1px 4px #00000022
}

.address .lock {
  font-size: 12px;
  opacity: .75
}

.address input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: #202124;
  font-size: 14px
}

/* ---------- Home ---------- */
.page {
  flex: 1;
  min-height: 0;
  position: relative
}

.home {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 14vh
}

.glogo {
  font-size: 64px;
  font-weight: 700;
  letter-spacing: -1px;
  margin-bottom: 26px;
  font-family: "Product Sans", "Google Sans", Roboto, Arial, sans-serif
}

.c1 {
  color: #4285F4
}

.c2 {
  color: #EA4335
}

.c3 {
  color: #FBBC05
}

.c4 {
  color: #34A853
}

.search-box {
  width: min(90vw, 560px);
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 0 20px;
  border: 1px solid #dfe1e5;
  border-radius: 24px;
  box-shadow: 0 1px 6px #20212409
}

.search-box:focus-within {
  justify-content: flex-start
}

.search-box:hover,
.search-box:focus-within {
  box-shadow: 0 1px 8px #20212429;
  border-color: transparent
}

.search-icon {
  color: #9aa0a6;
  font-size: 15px
}

.search-box input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  font-size: 16px;
  color: #202124;
  text-align: center
}

.search-box:focus-within input {
  text-align: left
}

.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 26px
}

.g-btn {
  padding: 9px 16px;
  border: 1px solid #f2f2f2;
  border-radius: 4px;
  background: #f8f9fa;
  color: #3c4043;
  font-size: 13px;
  cursor: pointer
}

.g-btn:hover {
  box-shadow: 0 1px 1px #0000001a;
  border-color: #dadce0;
  color: #202124
}

.quick-row {
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 48px;
  padding: 0 20px;
  max-width: 620px
}

.tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 68px;
  border: 0;
  background: none;
  cursor: pointer
}

.tile-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #f1f3f4;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 700;
  color: #fff
}

.tile:hover .tile-icon {
  filter: brightness(0.95)
}

.tile-label {
  font-size: 12px;
  color: #3c4043;
  max-width: 68px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap
}

.tile-add .tile-icon {
  background: #fff;
  border: 1.5px dashed #dadce0;
  color: #5f6368;
  font-size: 20px
}

.results {
  max-width: 820px;
  margin: auto;
  padding: 28px 22px 60px;
  color: #202124
}

/* ---------- Three-dot menu ---------- */
.menu-wrap {
  position: relative
}

.menu-dropdown {
  position: absolute;
  top: 42px;
  right: 0;
  width: 300px;
  max-height: 420px;
  overflow: hidden;
  background: #1b1b1f;
  color: #e8e8ea;
  border: 1px solid #3a3a3f;
  border-radius: 10px;
  box-shadow: 0 8px 28px #00000055;
  z-index: 30;
  padding: 6px
}

.menu-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 12px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: #e8e8ea;
  font-size: 14px;
  cursor: pointer;
  text-align: left
}

.menu-item:hover {
  background: #2c2c31
}

.menu-icon {
  width: 18px;
  text-align: center;
  font-size: 15px;
  opacity: .9
}

.menu-view .history-header {
  border-bottom: 1px solid #3a3a3f;
  color: #e8e8ea
}

.back-btn {
  border: 0;
  background: none;
  color: #e8e8ea;
  font-size: 18px;
  cursor: pointer;
  padding: 0 4px 0 0
}

.back-btn:hover {
  color: #fff
}

.history-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 10px;
  font-weight: 600;
  font-size: 13px
}

.history-header span {
  flex: 1
}

.clear-history {
  border: 0;
  background: none;
  color: #8ab4f8;
  cursor: pointer;
  font-size: 12px;
  padding: 0
}

.clear-history:hover {
  text-decoration: underline
}

.history-list {
  list-style: none;
  margin: 0;
  padding: 4px;
  max-height: 340px;
  overflow-y: auto
}

.history-item {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  color: #e8e8ea;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer
}

.history-item:hover {
  background: #2c2c31
}

.history-item.active {
  background: #33415e
}

.history-item .h-title {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.history-item .h-url {
  font-size: 11px;
  color: #9a9aa2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis
}

.history-empty {
  padding: 24px 14px;
  color: #9a9aa2;
  font-size: 13px;
  text-align: center
}

/* ---------- Browser view (iframe) ---------- */
.browser-view {
  position: absolute;
  inset: 0;
  background: #fff
}

.browser-view iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff
}

@media(max-width:650px) {
  .glogo {
    font-size: 46px
  }

  .home {
    padding-top: 9vh
  }
}

  </style>
</head>

<body>
  <div class="toolbar">
    <button class="tool" title="Back">‹</button>
    <button class="tool" title="Forward">›</button>
    <button class="tool" title="Reload">↻</button>
    <button class="tool" id="homeBtn" title="Home">⌂</button>

    <div class="address">
      <span class="lock" title="Proxied connection">🔒</span>
      <input id="address" value="search.local/" placeholder="Search or enter website">
    </div>

    <div class="menu-wrap">
      <button class="tool" id="menuBtn" title="Menu">⋮</button>
      <div class="menu-dropdown" id="menuDropdown" hidden>

        <div class="menu-view" id="menuMain">
          <button class="menu-item" id="menuNewTab">
            <span class="menu-icon">+</span>New tab
          </button>
          <button class="menu-item" id="menuHistoryItem">
            <span class="menu-icon">🕘</span>History
          </button>
        </div>

        <div class="menu-view" id="menuHistoryView" hidden>
          <div class="history-header">
            <button class="back-btn" id="historyBackBtn" title="Back">‹</button>
            <span>History</span>
            <button id="clearHistoryBtn" class="clear-history">Clear</button>
          </div>
          <ul class="history-list" id="historyList"></ul>
        </div>

      </div>
    </div>
  </div>

  <main class="page">
    <section class="home" id="home">
      <div class="glogo" aria-label="Duckly">
        <span class="c1">D</span><span class="c2">u</span><span class="c3">c</span><span class="c1">k</span><span class="c4">l</span><span class="c2">y</span>
      </div>

      <form class="search-box" id="searchForm">
        <span class="search-icon">⌕</span>
        <input id="query" placeholder="Search Duckly or type a URL" autocomplete="off">
      </form>

      <div class="btn-row">
        <button type="submit" class="g-btn">Duckly Search</button>
        <button type="button" class="g-btn" id="luckyBtn">I'm Feeling Lucky</button>
      </div>

      <div class="quick-row" id="quickRow">
        <button class="tile tile-add" id="addPinBtn" type="button" title="Add a shortcut">
          <span class="tile-icon">+</span>
          <span class="tile-label">Add</span>
        </button>
      </div>
    </section>

    <section class="results" id="results" hidden></section>

    <section class="browser-view" id="browserView" hidden>
      <iframe id="websiteFrame" title="Website" referrerpolicy="no-referrer" allow="fullscreen"></iframe>
    </section>
  </main>

  <script>
// Set this to your Cloudflare Worker URL after deploying worker/worker.js.
// Example: https://duckly-proxy.your-name.workers.dev/proxy
const PROXY_ENDPOINT = "https://duckly-proxy.dav1disking.workers.dev/proxy";
const PROXY_ORIGIN = new URL(PROXY_ENDPOINT).origin;

const query = document.getElementById("query");
const results = document.getElementById("results");
const home = document.getElementById("home");
const address = document.getElementById("address");
const browserView = document.getElementById("browserView");
const websiteFrame = document.getElementById("websiteFrame");
const historyBtn = document.getElementById("menuBtn");
const historyDropdown = document.getElementById("menuDropdown");
const historyList = document.getElementById("historyList");
const clearHistoryBtn = document.getElementById("clearHistoryBtn");
const homeBtn = document.getElementById("homeBtn");
const luckyBtn = document.getElementById("luckyBtn");
const menuMain = document.getElementById("menuMain");
const menuHistoryView = document.getElementById("menuHistoryView");
const menuNewTab = document.getElementById("menuNewTab");
const menuHistoryItem = document.getElementById("menuHistoryItem");
const historyBackBtn = document.getElementById("historyBackBtn");

// ---- History state --------------------------------------------------------
// { url, title } entries. Since the iframe now always points at our own
// /proxy endpoint, it's same-origin — so we can read contentWindow/contentDocument
// after every load, which is what lets Reload, page titles, and history all work.
let historyStack = [];
let historyIndex = -1;
let suppressHistoryPush = false; // true while we're driving navigation via Back/Forward/History
let pendingLucky = false; // true right after "I'm Feeling Lucky" triggers a search

document.getElementById("searchForm").addEventListener("submit", function (e) {
  e.preventDefault();
  search(query.value);
});

function search(term) {
  term = term.trim();
  if (!term) return;
  // The "lite" endpoint is a bare table-based page with no JS and no ad
  // slots, so nothing is left reserving blank space when proxied (unlike
  // the default /html/ endpoint, which has an ad placeholder that a script
  // normally resizes after the ad loads or fails — that resize doesn't
  // happen cleanly through the proxy, leaving a big empty gap at the top).
  goToUrl("https://lite.duckduckgo.com/lite/?q=" + encodeURIComponent(term));
}

luckyBtn.addEventListener("click", () => {
  const term = query.value.trim();
  if (!term) {
    query.focus();
    return;
  }
  pendingLucky = true;
  search(term);
});

function goAddress() {
  const raw = address.value.trim();
  if (!raw) return;

  let target = raw;

  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(target)) {
    if (/^[\w.-]+\.[a-z]{2,}(?:[/:?#].*)?$/i.test(target)) {
      target = "https://" + target;
    } else {
      search(raw);
      return;
    }
  }

  try {
    const url = new URL(target);
    if (url.protocol !== "http:" && url.protocol !== "https:") {
      search(raw);
      return;
    }
    goToUrl(url.href);
  } catch {
    search(raw);
  }
}

function proxyUrl(target) {
  const u = new URL(PROXY_ENDPOINT);
  u.searchParams.set("url", target);
  return u.href;
}

function goHome() {
  websiteFrame.src = "about:blank";
  browserView.hidden = true;
  results.hidden = true;
  home.hidden = false;
  address.value = "search.local/";
  query.value = "";
  query.focus();
}

homeBtn.addEventListener("click", goHome);

function goToUrl(url) {
  home.hidden = true;
  results.hidden = true;
  browserView.hidden = false;
  address.value = url;
  websiteFrame.src = proxyUrl(url);
}

// The GitHub Pages app and the proxy are different origins, so the parent
// cannot inspect the iframe DOM. The proxy sends navigation details back
// with postMessage instead.
window.addEventListener("message", (event) => {
  if (event.origin !== PROXY_ORIGIN) return;

  const data = event.data;
  if (!data || data.type !== "duckly:navigate" || !data.url) return;

  address.value = data.url;

  if (!suppressHistoryPush) {
    historyStack = historyStack.slice(0, historyIndex + 1);
    historyStack.push({
      url: data.url,
      title: data.title || data.url
    });
    historyIndex = historyStack.length - 1;
  }

  suppressHistoryPush = false;
  renderHistoryDropdown();
});

websiteFrame.addEventListener("load", () => {
  // Navigation details normally arrive through postMessage from the worker.
});

address.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    e.preventDefault();
    goAddress();
  }
});

// ---- Back / Forward / Reload ----------------------------------------------
const backButton = document.querySelector('.tool[title="Back"]');
if (backButton) {
  backButton.onclick = function () {
    if (historyIndex > 0) {
      historyIndex--;
      suppressHistoryPush = true;
      websiteFrame.src = proxyUrl(historyStack[historyIndex].url);
    }
  };
}

const forwardButton = document.querySelector('.tool[title="Forward"]');
if (forwardButton) {
  forwardButton.onclick = function () {
    if (historyIndex < historyStack.length - 1) {
      historyIndex++;
      suppressHistoryPush = true;
      websiteFrame.src = proxyUrl(historyStack[historyIndex].url);
    }
  };
}

const reloadButton = document.querySelector('.tool[title="Reload"]');
if (reloadButton) {
  reloadButton.onclick = function () {
    try {
      websiteFrame.contentWindow.location.reload();
    } catch {
      if (historyIndex >= 0) websiteFrame.src = proxyUrl(historyStack[historyIndex].url);
    }
  };
}

// ---- Three-dot menu -----------------------------------------------------
function openMenu() {
  historyDropdown.hidden = false;
  showMenuView("main");
}

function closeMenu() {
  historyDropdown.hidden = true;
}

function showMenuView(view) {
  const isHistory = view === "history";
  menuMain.hidden = isHistory;
  menuHistoryView.hidden = !isHistory;
  if (isHistory) renderHistoryDropdown();
}

historyBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if (historyDropdown.hidden) {
    openMenu();
  } else {
    closeMenu();
  }
});

menuNewTab.addEventListener("click", () => {
  closeMenu();
  goHome();
});

menuHistoryItem.addEventListener("click", () => showMenuView("history"));
historyBackBtn.addEventListener("click", () => showMenuView("main"));

document.addEventListener("click", () => {
  closeMenu();
});

historyDropdown.addEventListener("click", (e) => e.stopPropagation());

clearHistoryBtn.addEventListener("click", () => {
  historyStack = [];
  historyIndex = -1;
  renderHistoryDropdown();
});

function renderHistoryDropdown() {
  historyList.innerHTML = "";

  if (historyStack.length === 0) {
    historyList.innerHTML = '<li class="history-empty">No history yet</li>';
    return;
  }

  historyStack
    .slice()
    .reverse()
    .forEach((entry, revIdx) => {
      const idx = historyStack.length - 1 - revIdx;
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "history-item" + (idx === historyIndex ? " active" : "");

      const titleEl = document.createElement("div");
      titleEl.className = "h-title";
      titleEl.textContent = entry.title || entry.url;

      const urlEl = document.createElement("div");
      urlEl.className = "h-url";
      urlEl.textContent = entry.url;

      btn.appendChild(titleEl);
      btn.appendChild(urlEl);
      btn.addEventListener("click", () => jumpToHistory(idx));

      li.appendChild(btn);
      historyList.appendChild(li);
    });
}

function jumpToHistory(idx) {
  historyIndex = idx;
  suppressHistoryPush = true;
  home.hidden = true;
  results.hidden = true;
  browserView.hidden = false;
  websiteFrame.src = proxyUrl(historyStack[idx].url);
  historyDropdown.hidden = true;
}

// ---- Ctrl+K / Cmd+K focuses search or address, like a real browser ------
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if (!home.hidden) {
      query.focus();
    } else {
      address.focus();
      address.select();
    }
  }
});

// ---- Pinned shortcuts (Chrome-new-tab-style tiles) ------------------------
const PIN_KEY = "duckly_pins";
const PIN_COLORS = ["#4285F4", "#EA4335", "#FBBC05", "#34A853", "#9C27B0", "#00ACC1"];
const addPinBtn = document.getElementById("addPinBtn");
const quickRow = document.getElementById("quickRow");

function loadPins() {
  try {
    return JSON.parse(localStorage.getItem(PIN_KEY) || "[]");
  } catch {
    return [];
  }
}

function savePins(pins) {
  try {
    localStorage.setItem(PIN_KEY, JSON.stringify(pins));
  } catch {
    // localStorage unavailable (private browsing, etc.) — shortcuts just won't persist.
  }
}

let pins = loadPins();

function renderPins() {
  quickRow.querySelectorAll(".pin-tile").forEach((el) => el.remove());

  pins.forEach((pin, idx) => {
    const btn = document.createElement("button");
    btn.className = "tile pin-tile";
    btn.type = "button";
    btn.title = pin.url + " (right-click to remove)";

    const icon = document.createElement("span");
    icon.className = "tile-icon";
    icon.style.background = pin.color;
    icon.textContent = pin.label.slice(0, 1).toUpperCase();

    const label = document.createElement("span");
    label.className = "tile-label";
    label.textContent = pin.label;

    btn.appendChild(icon);
    btn.appendChild(label);

    btn.addEventListener("click", () => goToUrl(pin.url));
    btn.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      if (confirm(`Remove "${pin.label}" from your shortcuts?`)) {
        pins.splice(idx, 1);
        savePins(pins);
        renderPins();
      }
    });

    quickRow.insertBefore(btn, addPinBtn);
  });
}

addPinBtn.addEventListener("click", () => {
  const label = (prompt("Shortcut name (e.g. Wikipedia):") || "").trim();
  if (!label) return;
  let url = (prompt("Website address:") || "").trim();
  if (!url) return;
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) url = "https://" + url;

  pins.push({ label, url, color: PIN_COLORS[pins.length % PIN_COLORS.length] });
  savePins(pins);
  renderPins();
});

renderPins();

  </script>
</body>

</html>
