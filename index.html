<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Duckly Browser</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="browser">

    <div class="toolbar">
      <button class="tool" onclick="history.back()" title="Back">‹</button>
      <button class="tool" onclick="history.forward()" title="Forward">›</button>
      <button class="tool" onclick="location.reload()" title="Reload">↻</button>

      <div class="address">
        <input id="address" value="search.local/" placeholder="Search or enter website">

      </div>

      <button class="tool" title="Menu">⋮</button>
    </div>

    <main class="page">
      <section class="home" id="home">
        <div class="brand">Search-Engine</div>

        <form class="search-box" id="searchForm">
          <div>⌕</div>
          <input id="query" placeholder="Search anything..." autocomplete="off">
        </form>
      </section>

      <section class="results" id="results" hidden></section>
    </main>
  </div>

  <section class="browser-view" id="browserView" hidden>
    <iframe id="websiteFrame" title="Website" referrerpolicy="no-referrer" allow="fullscreen"></iframe>
  </section>

  <script src="index.js"></script>
</body>

</html>
